{# Overview for the project modal. Rendered once (inert <template>), cloned on click;
   the README tab is fetched from /api/projects/<name> only when opened. #}
{% set status_label = t('ai_summary') if r.status == 'ai' else (t('curated') if r.status == 'manual' else t('ai_pending')) %}
<template id="tpl-{{ r.slug }}" data-name="{{ r.name }}" data-title="{{ r.title }}" data-url="{{ r.html_url }}" data-home="{{ r.homepage }}">
  <p class="m-summary">{{ r.summary or r.description or t('no_description') }}</p>
  <div class="m-chips">
    <span class="cat-chip"><i class="dot dot-{{ r.category }}"></i>{{ t('cat_' ~ r.category) }}</span>
    <span class="ai-chip ai-{{ r.status }}">{{ icon('magic' if r.status == 'ai' else ('check' if r.status == 'manual' else 'clock')) }}{{ status_label }}{% if r.model %} · {{ r.model }}{% endif %}</span>
    {% if r.featured %}<span class="feat-chip">{{ icon('thumbtack') }}{{ t('featured') }}</span>{% endif %}
  </div>
  <div class="m-tabs" role="tablist">
    <button type="button" class="m-tab is-active" role="tab" aria-selected="true" data-tab="overview">{{ icon('layer-group') }}<span>{{ t('tab_overview') }}</span></button>
    <button type="button" class="m-tab" role="tab" aria-selected="false" data-tab="readme">{{ icon('book-open') }}<span>{{ t('tab_readme') }}</span></button>
  </div>
  <div class="m-panel" data-panel="overview" role="tabpanel">
    <div class="row g-3">
      <div class="col-lg-7 d-flex flex-column gap-3">
        {% if r.problem %}
        <section class="m-card"><h4>{{ icon('lightbulb') }}{{ t('problem') }}</h4><p>{{ r.problem }}</p></section>
        {% endif %}
        {% if r.key_points %}
        <section class="m-card">
          <h4>{{ icon('list') }}{{ t('key_points') }}</h4>
          <ul class="checks">{% for p in r.key_points %}<li>{{ icon('check') }}<span>{{ p }}</span></li>{% endfor %}</ul>
        </section>
        {% endif %}
        {% if r.reason or r.confidence is not none %}
        <section class="m-card">
          <h4>{{ icon('brain') }}{{ t('why_group') }}</h4>
          {% if r.reason %}<p>{{ r.reason }}</p>{% endif %}
          {% if r.confidence is not none %}
          <div class="meter">
            <span class="meter-label">{{ t('confidence') }}</span>
            <span class="meter-track" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ r.confidence }}" aria-label="{{ t('confidence') }}"><span class="meter-fill" data-w="{{ r.confidence }}"></span></span>
            <span class="meter-val">{{ r.confidence }}%</span>
          </div>
          {% endif %}
        </section>
        {% endif %}
        {% if not (r.problem or r.key_points or r.reason) %}
        <section class="m-card"><h4>{{ icon('info') }}{{ t('details') }}</h4><p>{{ r.description or t('no_description') }}</p></section>
        {% endif %}
      </div>
      <div class="col-lg-5 d-flex flex-column gap-3">
        <section class="m-card">
          <h4>{{ icon('info') }}{{ t('details') }}</h4>
          <dl class="facts">
            {% if r.language %}<div><dt>{{ t('language_label') }}</dt><dd><span class="lang lang-{{ r.lang_slug }}"><i></i>{{ r.language }}</span></dd></div>{% endif %}
            <div><dt>{{ t('stars') }}</dt><dd>{{ icon('star') }}{{ r.stars }}</dd></div>
            <div><dt>{{ t('forks') }}</dt><dd>{{ icon('code-branch') }}{{ r.forks }}</dd></div>
            <div><dt>{{ t('open_issues') }}</dt><dd><a href="{{ link('/issues?state=all&repo=' ~ r.name|urlencode) }}">{{ icon('dot-circle') }}{{ r.issue_count }}</a></dd></div>
            {% if r.license %}<div><dt>{{ t('license') }}</dt><dd>{{ r.license }}</dd></div>{% endif %}
            {% if r.created_at %}<div><dt>{{ t('created') }}</dt><dd><time class="date" datetime="{{ r.created_at }}">{{ r.created_at[:10] }}</time></dd></div>{% endif %}
            {% if r.updated_at %}<div><dt>{{ t('updated') }}</dt><dd><time class="rel" datetime="{{ r.updated_at }}">{{ r.updated_at[:10] }}</time></dd></div>{% endif %}
          </dl>
        </section>
        {% if r.tech %}
        <section class="m-card"><h4>{{ icon('code') }}{{ t('tech_stack') }}</h4><ul class="tech">{% for x in r.tech %}<li>{{ x }}</li>{% endfor %}</ul></section>
        {% endif %}
        {% if r.audience %}
        <section class="m-card"><h4>{{ icon('users') }}{{ t('audience') }}</h4><p>{{ r.audience }}</p></section>
        {% endif %}
        {% if r.topics %}
        <section class="m-card"><h4>{{ icon('tag') }}{{ t('topics') }}</h4><ul class="tags">{% for x in r.topics %}<li>{{ x }}</li>{% endfor %}</ul></section>
        {% endif %}
      </div>
    </div>
  </div>
  <div class="m-panel" data-panel="readme" role="tabpanel" hidden>
    <div class="markdown-body" data-readme="{{ r.name }}"><div class="readme-loading"><span class="spinner"></span>{{ t('loading_readme') }}</div></div>
  </div>
  <aside class="m-disclaimer">{{ icon('shield') }}<p><strong>{{ t('disclaimer_title') }}.</strong> {{ t('disclaimer_short') }} <a href="{{ link('/disclaimer') }}">{{ t('disclaimer_read') }}</a></p></aside>
</template>
